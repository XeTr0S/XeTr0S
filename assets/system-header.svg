<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hassrol — Shadow Developer</title>
  <desc id="desc">Bannière cyber fantasy inspirée d'une interface de statut</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050711"/>
      <stop offset=".5" stop-color="#0d0d1a"/>
      <stop offset="1" stop-color="#12051d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#00f0ff"/>
      <stop offset=".52" stop-color="#8a2be2"/>
      <stop offset="1" stop-color="#ff0055"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#8a2be2" stop-opacity=".34"/>
      <stop offset="1" stop-color="#8a2be2" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <ellipse cx="940" cy="182" rx="250" ry="230" fill="url(#aura)"/>

  <path d="M28 84V28h180M992 28h180v56M28 276v56h180m784 0h180v-56"
        fill="none" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
  <path d="M28 112h230M942 112h230M28 248h170m844 0h170"
        stroke="#00f0ff" stroke-opacity=".26"/>

  <g transform="translate(886 66)" fill="none">
    <circle cx="118" cy="114" r="91" stroke="#8a2be2" stroke-opacity=".2"/>
    <circle cx="118" cy="114" r="72" stroke="#00f0ff" stroke-opacity=".34" stroke-dasharray="4 9"/>
    <path d="M118 37l22 45 49 7-36 35 9 49-44-23-44 23 9-49-36-35 49-7z"
          stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
    <path d="M118 68v92M72 114h92" stroke="#00f0ff" stroke-opacity=".35"/>
    <circle cx="118" cy="114" r="10" fill="#00f0ff" fill-opacity=".18" stroke="#00f0ff"/>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="76" y="83" fill="#00f0ff" font-size="15" letter-spacing="5">PLAYER IDENTIFIED</text>
    <text x="72" y="159" fill="#f5f7ff" font-size="62" font-weight="700" letter-spacing="9">HASSROL</text>
    <rect x="76" y="181" width="530" height="2" fill="url(#neon)" filter="url(#glow)"/>
    <text x="76" y="222" fill="#a9b0c4" font-size="20" letter-spacing="4">SHADOW DEVELOPER</text>

    <g transform="translate(76 264)">
      <rect width="116" height="38" rx="4" fill="#00f0ff" fill-opacity=".08" stroke="#00f0ff" stroke-opacity=".55"/>
      <text x="58" y="25" fill="#00f0ff" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">RANK S</text>
      <rect x="132" width="142" height="38" rx="4" fill="#8a2be2" fill-opacity=".1" stroke="#8a2be2" stroke-opacity=".65"/>
      <text x="203" y="25" fill="#c88cff" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">LV. 99</text>
      <rect x="290" width="172" height="38" rx="4" fill="#ff0055" fill-opacity=".07" stroke="#ff0055" stroke-opacity=".55"/>
      <circle cx="312" cy="19" r="4" fill="#ff0055" filter="url(#glow)"/>
      <text x="384" y="25" fill="#ff4b83" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">ONLINE</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="url(#neon)" stroke-opacity=".3"/>
</svg>
