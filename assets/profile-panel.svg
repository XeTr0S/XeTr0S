<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Profil du joueur Hassrol</title>
  <desc id="desc">Hassrol, alias XeTr0S, développeur web de rang S, disponible</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080a12"/><stop offset=".55" stop-color="#0d0d1a"/><stop offset="1" stop-color="#16091f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff"/><stop offset=".5" stop-color="#b6b6b6"/><stop offset="1" stop-color="#686868"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#b6b6b6" stop-opacity=".35"/><stop offset="1" stop-color="#b6b6b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="348" rx="15" fill="url(#bg)" stroke="#293143"/>
  <rect x="1" y="1" width="1198" height="348" rx="15" fill="url(#grid)"/>
  <ellipse cx="180" cy="176" rx="180" ry="175" fill="url(#aura)"/>
  <path d="M1 349h245l14-9h680l14 9h245" fill="none" stroke="url(#neon)" stroke-opacity=".6"/>

  <!-- Player insignia -->
  <g transform="translate(62 62)">
    <path d="M118 0l102 59v118l-102 59L16 177V59z" fill="#0b1020" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
    <path d="M118 22l82 48v95l-82 48-82-48V70z" fill="none" stroke="#ffffff" stroke-opacity=".22"/>
    <circle cx="118" cy="118" r="62" fill="#b6b6b6" fill-opacity=".08" stroke="#b6b6b6" stroke-opacity=".38" stroke-dasharray="4 7"/>
    <text x="118" y="140" fill="#f4f0ff" font-family="'Segoe UI',Arial,sans-serif" font-size="68" font-weight="700" text-anchor="middle">H</text>
    <path d="M82 159h72" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
    <rect x="69" y="188" width="98" height="26" rx="13" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".6"/>
    <text x="118" y="206" fill="#ffffff" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="2">RANK S</text>
  </g>

  <!-- Identity -->
  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="342" y="58" fill="#68748b" font-size="12" letter-spacing="3">PLAYER IDENTITY</text>
    <text x="340" y="108" fill="#f4f6ff" font-size="38" font-weight="700" letter-spacing="4">HASSROL</text>
    <text x="342" y="139" fill="#ffffff" font-size="15" letter-spacing="3">@XETR0S</text>
    <path d="M342 160h790" stroke="url(#neon)" stroke-opacity=".5"/>

    <!-- Info cards -->
    <g transform="translate(342 184)">
      <rect width="236" height="72" rx="7" fill="#111521" stroke="#293349"/>
      <text x="18" y="25" fill="#69758c" font-size="11" font-weight="700" letter-spacing="2">CLASSE</text>
      <text x="18" y="53" fill="#eef2ff" font-size="17" font-weight="600">Développeur</text>
    </g>
    <g transform="translate(594 184)">
      <rect width="284" height="72" rx="7" fill="#111521" stroke="#293349"/>
      <text x="18" y="25" fill="#69758c" font-size="11" font-weight="700" letter-spacing="2">SPÉCIALITÉ</text>
      <text x="18" y="53" fill="#eef2ff" font-size="17" font-weight="600">Web &amp; programmation</text>
    </g>
    <g transform="translate(894 184)">
      <rect width="238" height="72" rx="7" fill="#111521" stroke="#b6b6b6" stroke-opacity=".55"/>
      <text x="18" y="25" fill="#69758c" font-size="11" font-weight="700" letter-spacing="2">STATUT</text>
      <circle cx="22" cy="51" r="5" fill="#d0d0d0" filter="url(#glow)"/>
      <text x="38" y="56" fill="#e2e2e2" font-size="17" font-weight="600">Disponible</text>
    </g>

    <!-- Bio strip -->
    <g transform="translate(342 276)">
      <rect width="790" height="43" rx="5" fill="#ffffff" fill-opacity=".035" stroke="#ffffff" stroke-opacity=".2"/>
      <text x="18" y="27" fill="#aeb7ca" font-size="14">
        Je transforme des idées en expériences numériques.
      </text>
      <text x="760" y="27" fill="#ffffff" font-size="11" text-anchor="end" letter-spacing="2">SYSTEM ONLINE</text>
    </g>
  </g>
</svg>
