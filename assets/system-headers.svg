<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hassrol — Shadow Developer</title>
  <desc id="desc">Bannière cyber fantasy inspirée d'une interface de statut</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050711"/>
      <stop offset=".5" stop-color="#0d0d1a"/>
      <stop offset="1" stop-color="#12051d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#ffffff"/>
      <stop offset=".52" stop-color="#b6b6b6"/>
      <stop offset="1" stop-color="#686868"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#b6b6b6" stop-opacity=".34"/>
      <stop offset="1" stop-color="#b6b6b6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>
  <ellipse cx="940" cy="182" rx="250" ry="230" fill="url(#aura)"/>

  <path d="M28 84V28h180M992 28h180v56M28 276v56h180m784 0h180v-56"
        fill="none" stroke="url(#neon)" stroke-width="2" filter="url(#glow)"/>
  <path d="M28 112h230M942 112h230M28 248h170m844 0h170"
        stroke="#ffffff" stroke-opacity=".26"/>

  <g transform="translate(886 66)" fill="none">
    <circle cx="118" cy="114" r="91" stroke="#b6b6b6" stroke-opacity=".2"/>
    <circle cx="118" cy="114" r="72" stroke="#ffffff" stroke-opacity=".34" stroke-dasharray="4 9"/>
    <path
      d="M184 45l-25 37c-16-14-38-20-59-12-27 10-42 39-32 66 8 22 28 36 51 37 15 0 29-5 40-15l-33-5c-18-3-31-20-28-39 3-21 23-35 44-31 14 3 25 13 30 25l20-29 14 41-13 4c-3 24-16 47-37 61-31 21-73 18-101-7-33-29-39-79-14-115 23-34 67-47 105-31l15-22z"
      fill="url(#neon)"
      fill-opacity=".16"
      stroke="url(#neon)"
      stroke-width="2.5"
      stroke-linejoin="round"
      filter="url(#glow)"
    />
    <path
      d="M127 84c2 14 15 23 16 38 1 14-8 27-22 31-15-3-25-15-24-29 1-13 11-22 18-32 1 11 5 17 10 20-2-10-1-19 2-28z"
      fill="#ffffff"
      fill-opacity=".72"
      stroke="#ffffff"
      stroke-width="1.8"
      stroke-linejoin="round"
      filter="url(#glow)"
    />
    <path d="M68 59l-12-15m94 11l14-18m-41 13l4-22" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-opacity=".65"/>
  </g>

  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="76" y="83" fill="#ffffff" font-size="15" letter-spacing="5">PLAYER IDENTIFIED</text>
    <text x="72" y="159" fill="#f5f7ff" font-size="62" font-weight="700" letter-spacing="9">HASSROL</text>
    <rect x="76" y="181" width="530" height="2" fill="url(#neon)" filter="url(#glow)"/>
    <text x="76" y="222" fill="#a9b0c4" font-size="20" letter-spacing="4">SHADOW DEVELOPER</text>

    <g transform="translate(76 264)">
      <rect width="116" height="38" rx="4" fill="#ffffff" fill-opacity=".08" stroke="#ffffff" stroke-opacity=".55"/>
      <text x="58" y="25" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">RANK S</text>
      <rect x="132" width="142" height="38" rx="4" fill="#b6b6b6" fill-opacity=".1" stroke="#b6b6b6" stroke-opacity=".65"/>
      <text x="203" y="25" fill="#c88cff" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">LV. 99</text>
      <rect x="290" width="172" height="38" rx="4" fill="#686868" fill-opacity=".07" stroke="#686868" stroke-opacity=".55"/>
      <circle cx="312" cy="19" r="4" fill="#686868" filter="url(#glow)"/>
      <text x="384" y="25" fill="#a5a5a5" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">ONLINE</text>
    </g>
  </g>

  <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="url(#neon)" stroke-opacity=".3"/>
</svg>
