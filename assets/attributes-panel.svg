      <stop stop-color="#090b14"/><stop offset="1" stop-color="#11091b"/>
    </linearGradient>
    <linearGradient id="cyan"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#b6b6b6"/></linearGradient>
    <linearGradient id="violet"><stop stop-color="#b6b6b6"/><stop offset="1" stop-color="#686868"/></linearGradient>
    <filter id="glow" x="-20%" y="-100%" width="140%" height="300%">
