<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Attributs du joueur Hassrol</title>
  <desc id="desc">Intelligence 90%, Agilité 80%, Perception 80%, Créativité 90%</desc>
  <defs>
